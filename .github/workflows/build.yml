name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python scripts/fetch_ffmpeg.py
      - run: python -m pytest -q
      - run: pyinstaller yt_downloader.spec --noconfirm
      - name: Smoke-test built exe (bundled ffmpeg, no system ffmpeg)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/YTDownloader/YTDownloader.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }
